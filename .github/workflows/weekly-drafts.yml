name: Weekly Draft Scaffold

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 9am UTC
    - cron: '0 9 * * 4'   # Thursday 9am UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create draft post
        id: scaffold
        run: |
          FILE=$(node scripts/new-post.mjs)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Created: $FILE"

      - name: Commit and push
        if: ${{ !startsWith(steps.scaffold.outputs.file, 'SKIP') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git commit -m "chore: scaffold draft post for $(date +%Y-%m-%d)"
          git push

      - name: Create reminder issue
        run: |
          SCAFFOLD_OUT="${{ steps.scaffold.outputs.file }}"
          if [[ "$SCAFFOLD_OUT" == SKIP* ]]; then
            COUNT="${SCAFFOLD_OUT#SKIP:}"
            TITLE="⚠️ Draft backlog — write before scaffolding more ($(date +'%B %d, %Y'))"
            BODY="You have ${COUNT} unwritten drafts piling up, so no new draft was created today. Finish one of the existing drafts in \`src/content/blog/\` first."
          else
            TITLE="📝 Write today's blog post — $(date +'%B %d, %Y')"
            BODY=$'A new draft is ready at `${{ steps.scaffold.outputs.file }}`.\n\n**To publish:**\n1. `git pull`\n2. Write your post in the draft file\n3. `npm run publish -- ${{ steps.scaffold.outputs.file }} "Your Title"`\n4. Commit and push — it deploys automatically'
          fi
          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
